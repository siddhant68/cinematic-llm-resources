<meta charset="utf-8">
<style>
{{BASECSS}}
.art{position:absolute;inset:0;background:url("{{IMG_ARTIFACT}}") {{ARTIFACT_POS}}/cover no-repeat;}
.scrim{position:absolute;inset:0;background:
  linear-gradient(to top, {{DEEP}}f2 0%, {{DEEP}}c0 26%, transparent 58%),
  linear-gradient(to right, {{DEEP}}b0 0%, transparent 42%);}
.block{position:absolute;left:52px;bottom:56px;z-index:5;max-width:1000px}
.rule{width:118px;height:11px;background:{{ACCENT}};margin-bottom:22px;border-radius:2px}
.type{text-shadow:0 6px 26px rgba(0,0,0,.75)}
</style>
<div class="stage">
  <div class="art"></div>
  <div class="scrim"></div>
  <span class="eyebrow">{{EYEBROW}}</span>
  <div class="block">
    <div class="rule"></div>
    <div class="type l1">{{LINE1}}</div>
    <div class="type l2">{{LINE2}}</div>
    <div class="type l3">{{LINE3}}</div>
  </div>
  <div class="badge-guard"></div>
</div>
