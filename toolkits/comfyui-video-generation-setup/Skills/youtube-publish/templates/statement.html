<meta charset="utf-8">
<style>
{{BASECSS}}
body{background:{{GROUND}}}
.bg{position:absolute;inset:0;background:url("{{IMG_BG}}") center/cover no-repeat;opacity:.30;
  filter:grayscale(.5) contrast(1.1)}
.wash{position:absolute;inset:0;background:
  radial-gradient(120% 90% at 18% 12%, {{GROUND}} 0%, {{DEEP}} 72%)}
.mark{position:absolute;right:-120px;top:-120px;width:620px;height:620px;border-radius:50%;
  background:{{ACCENT}};opacity:.14}
.block{position:absolute;left:64px;top:50%;transform:translateY(-50%);z-index:5;max-width:1080px}

.rule{width:150px;height:12px;background:{{ACCENT}};margin-top:30px;border-radius:2px}
</style>
<div class="stage">
  <div class="bg"></div><div class="wash"></div><div class="mark"></div>
  <span class="eyebrow">{{EYEBROW}}</span>
  <div class="block">
    <div class="type l1">{{LINE1}}</div>
    <div class="type l2">{{LINE2}}</div>
    <div class="type l3">{{LINE3}}</div>
    <div class="rule"></div>
  </div>
  <div class="badge-guard"></div>
</div>
