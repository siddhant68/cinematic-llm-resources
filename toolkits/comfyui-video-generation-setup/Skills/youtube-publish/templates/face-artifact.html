<meta charset="utf-8">
<style>
{{BASECSS}}
.art{position:absolute;top:0;right:0;width:790px;height:720px;
  background:url("{{IMG_ARTIFACT}}") {{ARTIFACT_POS}}/cover no-repeat;}
.art-scrim{position:absolute;top:0;right:0;width:790px;height:720px;
  background:linear-gradient(to right,{{DEEP}}ee 0%,{{DEEP}}66 30%,transparent 62%);}
.subj{position:absolute;left:0;bottom:0;width:560px;height:720px;
  background:url("{{IMG_SUBJECT}}") {{SUBJECT_POS}}/cover no-repeat;
  clip-path:polygon(0 0,100% 0,84% 100%,0 100%);}
.seam{position:absolute;left:470px;top:-40px;width:14px;height:820px;
  background:{{ACCENT}};transform:rotate(6.4deg);transform-origin:top center;z-index:4}
.block{position:absolute;right:52px;bottom:64px;z-index:5;text-align:right;max-width:740px}
.type{text-shadow:0 6px 30px rgba(0,0,0,.85)}
.l3{color:{{ACCENT}}}
</style>
<div class="stage">
  <div class="art"></div><div class="art-scrim"></div>
  <div class="subj"></div><div class="seam"></div>
  <span class="eyebrow">{{EYEBROW}}</span>
  <div class="block">
    <div class="type l1">{{LINE1}}</div>
    <div class="type l2">{{LINE2}}</div>
    <div class="type l3">{{LINE3}}</div>
  </div>
  <div class="badge-guard"></div>
</div>
